services:
  # Backend API
  - type: web
    name: seekker-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seekker-db
          property: connectionString

  # Streamlit Dashboard
  - type: web
    name: seekker-streamlit
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0

  # Static Frontend
  - type: web
    name: seekker-frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend

databases:
  # PostgreSQL Database
  - name: seekker-db
    databaseName: seekker_db
    user: seekker_db_user
    plan: free
