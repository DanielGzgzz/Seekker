name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'requirements.txt'
      - 'Dockerfile.api'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: synthetic-api
  REGION: us-central1
  DOCKER_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/synthetic-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker --quiet

    - name: Build and Push Container
      run: |-
        docker build -t $DOCKER_IMAGE:$GITHUB_SHA -f Dockerfile.api .
        docker push $DOCKER_IMAGE:$GITHUB_SHA

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy $SERVICE_NAME \
          --image $DOCKER_IMAGE:$GITHUB_SHA \
          --region $REGION \
          --no-allow-unauthenticated \
          --set-env-vars="PROJECT_ID=${PROJECT_ID},REGION=${REGION},DB_USER=${{ secrets.DB_USER }},DB_PASS=${{ secrets.DB_PASS }},DB_NAME=${{ secrets.DB_NAME }},DB_HOST=/cloudsql/${PROJECT_ID}:${REGION}:${{ secrets.DB_INSTANCE_NAME }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" \
          --set-cloudsql-instances="${PROJECT_ID}:${REGION}:${{ secrets.DB_INSTANCE_NAME }}" \
          --port 8080
